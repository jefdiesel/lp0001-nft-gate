# TEST ONLY (T4). See ../README.md.
[package]
name = "lp0001-t4-hostile-guest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[profile.release]
debug = 0
strip = "symbols"

[[bin]]
name = "lp0001-t4-hostile"
path = "src/bin/hostile.rs"

[dependencies]
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
risc0-zkvm = { version = "=3.0.5", default-features = false }
ruint = { version = "=1.17.0", default-features = false }
lp0001_t4_hostile = { path = "../hostile" }
