# SPDX-License-Identifier: MIT OR Apache-2.0
# The logic workspace: pure crates and the two program crates, all testable natively.
# Guests (guests/*) and the client (client/) are separate workspaces on purpose: the
# fast tests here never compile the wallet crate or a risc0 guest.
[workspace]
resolver = "2"
members = [
    "crates/gate_core",
    "crates/gate_interface",
    "crates/gate_program",
    "crates/consumer_program",
    "crates/gate_verify",
    "crates/gate_wasm",
    "crates/gate_wallet_rules",
    "crates/storage_client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gate_core = { path = "crates/gate_core" }
gate_interface = { path = "crates/gate_interface" }
gate_program = { path = "crates/gate_program" }
consumer_program = { path = "crates/consumer_program" }
gate_verify = { path = "crates/gate_verify" }
gate_wallet_rules = { path = "crates/gate_wallet_rules" }
# Pins, as the reference NFT program (lez-programs refactor/lez-v0.4.x @ dea23c2) uses them.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
nft_core = { git = "https://github.com/logos-blockchain/lez-programs.git", rev = "dea23c22a47c728c9b6f925d0ef1677f99613f09" }
nft_program = { git = "https://github.com/logos-blockchain/lez-programs.git", rev = "dea23c22a47c728c9b6f925d0ef1677f99613f09" }
risc0-zkvm = { version = "=3.0.5", default-features = false }
borsh = { version = "1.5", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
serde_json = "1"
