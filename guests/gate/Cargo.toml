# SPDX-License-Identifier: MIT OR Apache-2.0
# The gate guest. Build only with LP0001_NFT_PROGRAM set (64 hex): the build refuses otherwise.
# Deploy only with `spel deploy ... --immutable` (spec §2.1). See RUN-AFTER-3AM.txt.
[package]
name = "lp0001-gate-guest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[profile.release]
debug = 0
strip = "symbols"

[[bin]]
name = "lp0001-gate"
path = "src/bin/gate.rs"

[dependencies]
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
risc0-zkvm = { version = "=3.0.5", default-features = false }
# As the reference nft-guest pins it: ruint 1.18 raised its MSRV past the risc0 guest rustc.
ruint = { version = "=1.17.0", default-features = false }
gate_program = { path = "../../crates/gate_program" }
